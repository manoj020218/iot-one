[platformio]
default_envs = esp32-s3-schoolbell
description = Jenix SchoolBell ESP32-S3 standalone bell runtime

[env:esp32-s3-schoolbell]
platform = espressif32 @ 6.9.0
board = 4d_systems_esp32s3_gen4_r8n16
framework = espidf
monitor_speed = 115200
build_type = debug
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
build_flags =
  -DAPP_VERSION=\"0.6.2-sd-stat-fix\"
  -DJENIX_PRODUCT_BUILD=1
  -std=gnu++17
monitor_filters =
  esp32_exception_decoder
  time

; IMPORTANT:
; This project now uses the same EdgeHex N16R8 baseline proven in the
; FloodGuard project. Board-level SDMMC, LED, button, and I2C pins are filled.
; DS3231 and PCM5102 pins are grouped on opposite headers; both still require
; validation on the real school-bell hardware carrier before deployment.
