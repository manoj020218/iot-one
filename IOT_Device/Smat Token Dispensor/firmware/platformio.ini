; ===========================================================================
; Jenix Smart Token Dispenser — JNX-TD-C3-01
; MCU: ESP32-C3 Super Mini (HW-466AB)
; Platform: Jenix One IoT Platform
; ===========================================================================

[platformio]
default_envs = jenix-td-c3
; ESP-IDF's CMake build (used by the jenix-td-c3-prov2 mixed
; arduino+espidf env) hard-fails on any whitespace in its build path, and
; this project's own path contains spaces. This redirects ONLY the
; transient, gitignored .pio/build cache to a space-free location outside
; the project — no source files move, nothing else about the project
; layout changes. Applies to all envs equally (a PlatformIO-wide setting),
; but is otherwise inert: same source in, byte-identical firmware.bin out.
build_dir = C:/pio-builds/jenix-td-c3-firmware
; Mixed arduino+espidf builds on PlatformIO expect the canonical `main`
; component target, not the default `src` target this project started with.
; Point PlatformIO's source root at wrapper files under main/ that redirect
; back into the real implementation tree in src/, mirroring the working
; QRunlock provisioning-v2 layout.
src_dir = main

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[common]
monitor_speed    = 115200
framework        = arduino
platform         = espressif32

build_flags =
    -Iinclude
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DMQTT_KEEPALIVE=60
    -DMQTT_SOCKET_TIMEOUT=5
    -DFIRMWARE_VERSION='"v1.0.0"'
    -DFIRMWARE_BUILD_DATE='"2026-07-04"'
    -DFIRMWARE_PID='"JNX-TD-C3-01"'
    -DFIRMWARE_PROFILE='"TOKEN_DISPENSER_C3_V1"'

lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson@^7.2.1
    knolleary/PubSubClient@^2.8.0
    h2zero/NimBLE-Arduino@^1.4.3

; ---------------------------------------------------------------------------
; Production target — ESP32-C3 Super Mini (HW-466AB) USB-C
; To flash: hold BOOT (GPIO9) + replug USB, then run upload
; ---------------------------------------------------------------------------
[env:jenix-td-c3]
platform               = ${common.platform}
framework              = ${common.framework}
board                  = esp32-c3-devkitm-1
monitor_speed          = ${common.monitor_speed}
board_build.filesystem = spiffs
board_build.partitions = partitions.csv
build_flags            = ${common.build_flags}
lib_deps               = ${common.lib_deps}
upload_port            = COM4
upload_speed           = 115200
upload_protocol        = esptool
upload_flags           =
    --before=default_reset
    --after=hard_reset
    --chip=esp32c3
monitor_port           = COM4
monitor_filters        = esp32_exception_decoder, colorize
extra_scripts          = pre:scripts/gen_build_info.py

; ---------------------------------------------------------------------------
; Provisioning-v2 pilot — Espressif wifi_provisioning/protocomm (Security
; Scheme 2 / SRP6a), per PROVISIONING.md. Separate env, separate partition
; table (single app slot, no OTA rollback) — does not touch jenix-td-c3.
; NimBLE-Arduino is dropped here: the ESP-IDF protocomm BLE transport owns
; the BLE controller instead, so the two must not both be linked in.
; ---------------------------------------------------------------------------
[env:jenix-td-c3-prov2]
platform               = ${common.platform}
framework              = arduino, espidf
extra_scripts          =
    pre:scripts/prov2_espidf5_bootstrap.py
    pre:scripts/gen_build_info.py
    post:scripts/fix_pio_space_flags.py
; PlatformIO 6.13 otherwise auto-selects ESP-IDF 4.4.7 for mixed
; arduino+espidf builds, which does not expose the SRP Security 2 headers
; this provisioning-v2 pilot needs. Pin the already-installed IDF 5.3.1
; package and a private Arduino core copy so the bootstrap patches stay
; isolated from the shipping env.
platform_packages =
    framework-arduinoespressif32=file://${platformio.packages_dir}/framework-arduinoespressif32-3.20017.241212+sha.dcc1105b-token-dispenser-prov2
    framework-espidf=file://${platformio.packages_dir}/framework-espidf@3.50301.0
    platformio/toolchain-riscv32-esp@13.2.0+20240530
board                  = esp32-c3-devkitm-1
monitor_speed          = ${common.monitor_speed}
board_build.filesystem = spiffs
board_build.partitions = partitions_prov2.csv
build_flags            = ${common.build_flags} -DJENIX_PROV_V2=1 -DASYNCTCP_LEGACY_IPADDRESS_API=1
lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson@^7.2.1
    knolleary/PubSubClient@^2.8.0
upload_port            = COM4
upload_speed            = 115200
upload_protocol        = esptool
upload_flags           =
    --before=default_reset
    --after=hard_reset
    --chip=esp32c3
monitor_port           = COM4
monitor_filters        = esp32_exception_decoder, colorize

; ---------------------------------------------------------------------------
; OTA upload target (after first flash, set upload_port to device IP)
; ---------------------------------------------------------------------------
[env:jenix-td-c3-ota]
platform               = ${common.platform}
framework              = ${common.framework}
board                  = esp32-c3-devkitm-1
board_build.filesystem = spiffs
board_build.partitions = partitions.csv
build_flags            = ${common.build_flags}
lib_deps               = ${common.lib_deps}
upload_protocol        = espota
; upload_port          = 192.168.x.x
upload_flags           =
    --port=3232
    --auth=jenix_ota_secret
