[platformio]
default_envs = esp32-c3-supermini
; ESP-IDF's CMake build is brittle around whitespace in project paths. Keep
; the source tree where it is and redirect only the transient build cache for
; mixed arduino+espidf pilot envs.
build_dir = C:/pio-builds/qrunlock
; 2026-08-22 update: isolation implemented AND actually build-tested (not
; just inspected) — see full results in QRUNLOCK_PROVISIONING_HANDOFF.md's
; "2026-08-22 — isolation verified by actually building it" section. Short
; version: the private-copy wiring itself had a real bug
; (platform.get_package_dir() ignores platform_packages entirely — it's a
; platform.json-manifest-only lookup, confirmed by reading PlatformIO's own
; source), now fixed in prov2_espidf5_bootstrap.py by computing the private
; path directly instead of trusting that call. Verified via a real
; `pio run -e esp32-c3-supermini-prov2`: the safety guard correctly
; refused to touch the shared package on the first (still-broken) attempt,
; and after the fix, the build used the private copy, got further than
; ever before (past CMake configure, hit a new "Detected two different
; targets... __idf_src or 'main' folder" error), and the shared package's
; known-vulnerable file (compare_set.h) had an IDENTICAL checksum before
; and after every attempt. Shipping rebuilt truly-clean immediately after:
; success, 76.1% flash, 16.2% RAM — no regression.
;
; The "Detected two different targets" error is real remaining work
; (probably main/CMakeLists.txt and an auto-generated src/CMakeLists.txt
; both being visible to CMake at once) — not a safety issue, safe to debug
; further.
; History on src_dir (2026-08-21/22), corrected: main/ turned out NOT to be
; a stale duplicate — main/*.cpp are real, intentional one-line
; #include-redirect shims back into src/ (see e.g. main/app/AppController.cpp:
; `#include "../../src/app/AppController.cpp"`), and main/ldf_hints.cpp
; keeps PlatformIO's dependency scanner aligned. That part of the __idf_main
; naming fix is fine and does not need touching.
;
; *** ACTIVE HAZARD, unresolved as of 2026-08-22 — READ BEFORE BUILDING
; esp32-c3-supermini-prov2 AGAIN ***
;
; tools/prov2_espidf5_bootstrap.py (this env's `pre:` extra_script) directly,
; permanently edits files INSIDE THE SHARED, GLOBAL
; C:\Users\User\.platformio\packages\framework-arduinoespressif32 package —
; the exact same package the shipping esp32-c3-supermini env compiles
; against. It rewrites several core headers (Arduino.h, esp32-hal-psram.c,
; spinlock.h, compare_set.h, WiFiGeneric.h, WiFiClient.h, ssl_client.h) to
; work under the pinned IDF 5.3.1 layout. Nothing reverts these edits after
; a prov2 build finishes. The FIRST time this ran, it left compare_set.h
; rewritten to `#include "soc_memory_types.h"` (bare) instead of
; `#include "soc/soc_memory_types.h"` — fine under prov2's IDF 5.3.1 include
; layout, but the shipping env's IDF-4.4.7-shaped include list has no bare-
; reachable path for that header, so the very next truly-clean shipping
; build failed with `soc_memory_types.h: No such file or directory` — the
; shipping/production firmware was silently unbuildable with zero warning
; until this was caught 2026-08-22 (root-caused by comparing a verbose
; compile line against a truly clean rebuild, then confirmed by reading this
; script). No number of "harmless" test rebuilds catches this if they only
; ever hit a warm cache — see the deep+ / component_requires.temp.cmake
; false confidence from 2026-08-21 in QRUNLOCK_PROVISIONING_HANDOFF.md for
; the same lesson learned twice in one week.
;
; Fixed 2026-08-22 by manually reversing every one of the script's edits,
; then (since the manual reversal itself introduced ANOTHER shipping
; failure — the "before" text the script assumes is not reliably the true
; pristine state) deleting framework-arduinoespressif32 entirely and letting
; PlatformIO fetch a genuinely fresh copy. Verified clean: 76.1% flash,
; 16.2% RAM, two consecutive successful builds.
;
; DO NOT run `pio run -e esp32-c3-supermini-prov2` again until
; prov2_espidf5_bootstrap.py is rewritten to patch an ISOLATED, prov2-only
; copy of framework-arduinoespressif32 — the same pattern this file already
; uses correctly for framework-espidf (platform_packages pointing at a
; versioned local copy, e.g. framework-espidf@3.50301.0, never the shared
; default). Until that's done, every prov2 build is a live risk to the
; shipping firmware. After that fix lands, verify by fully deleting
; C:\pio-builds\qrunlock\esp32-c3-supermini and rebuilding — a cache hit is
; not a valid verification, as this incident demonstrated.

[env]
test_framework = unity
build_flags =
  -Isrc

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.f_cpu = 80000000L
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_unflags =
  -std=gnu++11
build_flags =
  ${env.build_flags}
  -std=gnu++17
  -Wno-error=overloaded-virtual
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  h2zero/NimBLE-Arduino@^1.4.2
  knolleary/PubSubClient@^2.8

[env:esp32-c3-supermini-prov2]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino, espidf
extra_scripts =
  pre:tools/prov2_espidf5_bootstrap.py
  post:tools/fix_pio_space_flags.py
; Mixed Arduino+ESP-IDF builds on PlatformIO 6.13 are downgraded to IDF 4.4.7
; by default, which has no Security Scheme 2 support in wifi_provisioning.
; Pin the locally-installed IDF 5.3.1 package and matching C3 toolchain so
; the prov2 pilot can actually use wifi_prov_mgr Security 2.
platform_packages =
  framework-arduinoespressif32=file://${platformio.packages_dir}/framework-arduinoespressif32%%403.20017.241212+sha.dcc1105b-qrunlock-prov2
  framework-espidf=file://${platformio.packages_dir}/framework-espidf@3.50301.0
  platformio/toolchain-riscv32-esp@13.2.0+20240530
board_build.f_cpu = 80000000L
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_prov2.csv
build_unflags =
  -std=gnu++11
build_flags =
  ${env.build_flags}
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  -D JENIX_PROV_V2=1
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  knolleary/PubSubClient@^2.8

[env:native]
platform = native
test_build_src = no
build_flags =
  ${env.build_flags}
  -std=gnu++17
