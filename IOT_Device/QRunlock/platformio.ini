[platformio]
default_envs = esp32-c3-supermini
; ESP-IDF's CMake build is brittle around whitespace in project paths. Keep
; the source tree where it is and redirect only the transient build cache for
; mixed arduino+espidf pilot envs.
build_dir = C:/pio-builds/qrunlock

[env]
test_framework = unity
build_flags =
  -Isrc

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.f_cpu = 80000000L
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_unflags =
  -std=gnu++11
build_flags =
  ${env.build_flags}
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  h2zero/NimBLE-Arduino@^1.4.2
  knolleary/PubSubClient@^2.8

[env:esp32-c3-supermini-prov2]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino, espidf
board_build.f_cpu = 80000000L
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_prov2.csv
build_unflags =
  -std=gnu++11
build_flags =
  ${env.build_flags}
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  -D JENIX_PROV_V2=1
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  h2zero/NimBLE-Arduino@^1.4.2
  knolleary/PubSubClient@^2.8

[env:native]
platform = native
test_build_src = no
build_flags =
  ${env.build_flags}
  -std=gnu++17
