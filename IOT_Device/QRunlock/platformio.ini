[platformio]
default_envs = esp32-c3-supermini
; ESP-IDF's CMake build is brittle around whitespace in project paths. Keep
; the source tree where it is and redirect only the transient build cache for
; mixed arduino+espidf pilot envs.
build_dir = C:/pio-builds/qrunlock
; PlatformIO only honors src_dir at this global [platformio] level — it is
; NOT a valid per-env option (confirmed: setting it under
; [env:esp32-c3-supermini-prov2] alone makes PlatformIO warn "Ignore unknown
; configuration option `src_dir`" and the pilot env regresses straight back
; to "Couldn't find the main target of the project!"). This line, plus
; main/CMakeLists.txt's glob-redirect back into src/, is what gets the
; ESP-IDF builder to recognize a __idf_main component and get past that
; failure. Verified harmless for the shipping esp32-c3-supermini env: its
; classic Arduino build never reads src_dir (it uses -Isrc directly) and
; produces byte-identical output with or without this line.
src_dir = main

[env]
test_framework = unity
build_flags =
  -Isrc

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_ldf_mode = deep+
board_build.f_cpu = 80000000L
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_unflags =
  -std=gnu++11
build_flags =
  ${env.build_flags}
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  h2zero/NimBLE-Arduino@^1.4.2
  knolleary/PubSubClient@^2.8

[env:esp32-c3-supermini-prov2]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino, espidf
extra_scripts = post:tools/fix_pio_space_flags.py
board_build.f_cpu = 80000000L
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_prov2.csv
build_unflags =
  -std=gnu++11
build_flags =
  ${env.build_flags}
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
  -D JENIX_PROV_V2=1
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  h2zero/NimBLE-Arduino@^1.4.2
  knolleary/PubSubClient@^2.8

[env:native]
platform = native
test_build_src = no
build_flags =
  ${env.build_flags}
  -std=gnu++17
