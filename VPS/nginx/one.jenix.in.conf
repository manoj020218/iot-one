# Canonical nginx config for one.jenix.in.
#
# Layout on disk:
#   /var/www/one.jenix.in/          -> Marekting/ build output (marketing site, root)
#   /var/www/one.jenix.in/app/      -> PWA_APK/apps/web-pwa build output (the actual app)
#
# The PWA is built with `base: "/app/"` (vite.config.ts) specifically so its
# asset references resolve correctly when copied into that subfolder. Do not
# move the PWA to a different path without updating that base config to match.
#
# Deploy (after `pnpm --filter @jenix/web-pwa build` and
# `pnpm --filter smart-one-marketing build` locally or via CI):
#   rsync -a --delete Marekting/dist/            root@vps:/var/www/one.jenix.in/
#   rsync -a --delete PWA_APK/apps/web-pwa/dist/  root@vps:/var/www/one.jenix.in/app/
#   nginx -t && systemctl reload nginx

server {
    server_name one.jenix.in;

    root /var/www/one.jenix.in;
    index index.html;

    # PWA — must be checked before the marketing site's own SPA fallback (the
    # ^~ prefix modifier stops nginx from also trying any regex location for
    # this prefix, matching the style already used for /ui-packages/ below).
    location ^~ /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location ^~ /ui-packages/ {
        alias /root/projects/IOT_one/device-registry/ui-packages/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Marketing site's own SPA fallback — only reached for paths that didn't
    # match /app/, /ui-packages/, or /api/ above.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/one.jenix.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/one.jenix.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = one.jenix.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name one.jenix.in;
    return 404; # managed by Certbot
}
